<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARENA · Reserva tu campo — AirNation</title>
<!--
  MAQUETA DE REFERENCIA — ARENA MARKETPLACE (AirNation)
  Datos de ejemplo. No es código de producción: es la guía visual y de comportamiento.

  Vistas (router por hash, en producción son rutas de Next.js):
    #/                 → /arena                    Landing del marketplace: buscador, filtros, cards
    #/campo/<slug>     → /arena/[slug]             Detalle del campo con reserva en la misma página
    #/checkout         → /arena/checkout           Datos de contacto + pago del carrito
    #/confirmacion     → /arena/confirmacion       Reservas confirmadas con su QR

  Componentes marcados con  COMPONENTE: <Nombre>  en este archivo.
  Carrito: vive en el cliente (localStorage) hasta pagar; al pagar el backend crea
  todas las reservas juntas (arena_create_checkout) y un solo pago.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700;800;900&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #111111;
  --paper: #FFFFFF;
  --field: #F4F4F4;
  --rule: #EEEEEE;
  --rule-strong: #CCCCCC;
  --muted: #666666;
  --soft: #999999;
  --red: #CC4B37;
  --red-dark: #A93A28;
  --red-tint: #FBEDEA;
  --ok: #2F7D4F;
  --ok-tint: #EAF5EE;
  --jost: 'Jost', system-ui, sans-serif;
  --lato: 'Lato', system-ui, sans-serif;
  --radius: 2px;
  --max: 1200px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--lato);
  font-size: 15px;
  line-height: 1.5;
  min-width: 320px;
}
img { max-width: 100%; display: block; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.wrap { max-width: var(--max); margin: 0 auto; padding: 0 16px; }
@media (min-width: 768px) { .wrap { padding: 0 24px; } }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Títulos de marca: Jost en mayúsculas, solo para encabezados y precios */
.h-brand { font-family: var(--jost); font-weight: 800; text-transform: uppercase; letter-spacing: .01em; line-height: 1.1; margin: 0; }
.price { font-family: var(--jost); font-weight: 800; font-variant-numeric: tabular-nums; }

/* Botones */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border: 1px solid transparent; border-radius: var(--radius);
  font-family: var(--jost); font-weight: 700; font-size: 14px; letter-spacing: .04em; text-transform: uppercase;
  text-decoration: none; background: none;
}
.btn-primary { background: var(--red); color: #fff; }
.btn-primary:hover { background: var(--red-dark); }
.btn-dark { background: var(--ink); color: #fff; }
.btn-dark:hover { background: #2a2a2a; }
.btn-line { border-color: var(--ink); color: var(--ink); background: var(--paper); }
.btn-line:hover { background: var(--field); }
.btn-ghost { color: var(--muted); padding: 0 8px; min-height: 36px; text-transform: none; letter-spacing: 0; font-family: var(--lato); font-weight: 700; }
.btn-ghost:hover { color: var(--ink); }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* ===== COMPONENTE: ArenaHeader ===== */
.site-header { position: sticky; top: 0; z-index: 40; background: var(--paper); border-bottom: 1px solid var(--rule); }
.site-header .wrap { display: flex; align-items: center; gap: 16px; height: 60px; }
.logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
.logo-mark { width: 24px; height: 24px; background: var(--red); display: grid; place-items: center; }
.logo-word { font-family: var(--jost); font-weight: 900; letter-spacing: .18em; font-size: 15px; }
.logo-word span { color: var(--red); }
.arena-tag { font-family: var(--jost); font-weight: 800; font-size: 12px; letter-spacing: .14em; padding: 3px 7px; border: 1px solid var(--ink); }
.main-nav { display: none; gap: 4px; margin-left: 12px; }
.main-nav a { font-family: var(--jost); font-weight: 600; font-size: 13px; text-decoration: none; padding: 8px 10px; color: var(--muted); }
.main-nav a:hover { color: var(--ink); }
.main-nav a[aria-current="page"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--red); }
.header-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.cart-btn { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border: 1px solid var(--rule); background: var(--paper); border-radius: var(--radius); font-family: var(--jost); font-weight: 700; font-size: 13px; }
.cart-btn:hover { border-color: var(--rule-strong); }
.cart-count { min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--red); color: #fff; font-size: 11px; display: inline-grid; place-items: center; }
.cart-count[data-n="0"] { background: var(--field); color: var(--muted); }
.cart-btn.bump .cart-count { animation: bump .45s ease; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
.account-link { display: none; font-family: var(--jost); font-weight: 700; font-size: 13px; text-decoration: none; padding: 9px 12px; border: 1px solid var(--rule); }
@media (min-width: 900px) { .main-nav { display: flex; } .account-link { display: inline-block; } }

/* ===== COMPONENTE: ArenaHero (buscador + franja de fechas) ===== */
.hero { position: relative; background: var(--ink); color: #fff; overflow: hidden; }
.hero-topo { position: absolute; inset: 0; opacity: .16; pointer-events: none; }
.hero .wrap { position: relative; padding-top: 40px; padding-bottom: 28px; }
.hero h1 { font-size: clamp(30px, 6vw, 52px); max-width: 14ch; }
.hero-sub { margin: 12px 0 0; color: #BDBDBD; font-size: 16px; max-width: 52ch; }
.search {
  margin-top: 24px; display: grid; gap: 1px; background: #2a2a2a; border: 1px solid #2a2a2a;
  grid-template-columns: 1fr;
}
.search-field { background: var(--paper); color: var(--ink); padding: 8px 14px; display: flex; flex-direction: column; justify-content: center; min-height: 60px; }
.search-field label { font-size: 12px; color: var(--muted); font-weight: 700; }
.search-field select { border: 0; padding: 2px 0; background: transparent; font-weight: 700; font-size: 15px; width: 100%; outline-offset: 4px; }
.search-btn { min-height: 56px; }
@media (min-width: 768px) {
  .search { grid-template-columns: 1.3fr 1fr 1fr auto; }
  .search-btn { min-height: 60px; padding: 0 28px; }
}
.date-strip-label { margin: 22px 0 10px; font-size: 14px; color: #BDBDBD; }
.date-strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; scrollbar-color: #444 transparent; }
.date-tile {
  flex: 0 0 auto; width: 60px; min-height: 64px; padding: 6px 0; border: 1px solid #3a3a3a; background: transparent; color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: var(--radius);
}
.date-tile .dow { font-size: 12px; color: #BDBDBD; text-transform: capitalize; }
.date-tile .num { font-family: var(--jost); font-weight: 800; font-size: 22px; line-height: 1.1; }
.date-tile .mon { font-size: 11px; color: #8a8a8a; }
.date-tile.weekend { border-color: #575757; }
.date-tile:hover { border-color: #fff; }
.date-tile[aria-pressed="true"] { background: var(--red); border-color: var(--red); }
.date-tile[aria-pressed="true"] .dow, .date-tile[aria-pressed="true"] .mon { color: #fff; }
.date-tile.any { width: auto; padding: 0 14px; font-family: var(--jost); font-weight: 700; font-size: 14px; }

/* ===== Layout de resultados ===== */
.market { padding: 28px 0 56px; scroll-margin-top: 60px; }
#book { scroll-margin-top: 72px; }
.market-grid { display: grid; gap: 28px; grid-template-columns: 1fr; }
@media (min-width: 1000px) { .market-grid { grid-template-columns: 260px 1fr; } }

/* ===== COMPONENTE: ArenaFiltros ===== */
.filters { align-self: start; }
.filters-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.filters-head h2 { font-size: 18px; }
.fgroup { border-top: 1px solid var(--rule); padding: 16px 0; }
.fgroup > p { margin: 0 0 10px; font-weight: 700; font-size: 14px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 15px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--red); margin: 0; }
.check .count { margin-left: auto; color: var(--soft); font-size: 13px; }
.range-row { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); margin-top: 6px; }
input[type="range"] { width: 100%; accent-color: var(--red); }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; font-size: 15px; cursor: pointer; }
.switch { position: relative; width: 40px; height: 22px; flex: 0 0 auto; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; background: var(--rule-strong); border-radius: 11px; transition: background .15s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch input:checked + span { background: var(--red); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 2px solid var(--red); outline-offset: 2px; }
.filters-apply { display: none; }
.filters-open-btn { display: inline-flex; }
@media (max-width: 999px) {
  .filters {
    position: fixed; inset: auto 0 0 0; z-index: 60; background: var(--paper); max-height: 86vh; overflow-y: auto;
    padding: 16px 16px 0; border-top: 1px solid var(--rule); transform: translateY(100%); transition: transform .25s ease; visibility: hidden;
  }
  .filters.open { transform: translateY(0); visibility: visible; }
  .filters-apply { display: block; position: sticky; bottom: 0; background: var(--paper); padding: 12px 0 16px; border-top: 1px solid var(--rule); }
}
@media (min-width: 1000px) { .filters-open-btn { display: none; } .filters .filters-close { display: none; } }
.filters-head > div { display: flex; align-items: center; gap: 4px; }
.scrim { position: fixed; inset: 0; background: rgba(17,17,17,.5); z-index: 55; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.show { opacity: 1; pointer-events: auto; }

.results-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 12px; }
.results-bar h2 { font-size: 20px; margin-right: auto; }
.results-bar h2 small { display: block; font-family: var(--lato); font-weight: 400; text-transform: none; font-size: 14px; color: var(--muted); margin-top: 4px; letter-spacing: 0; }
.sort { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.sort select, .select { height: 40px; padding: 0 10px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--paper); font-weight: 700; color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 1px solid var(--rule); background: var(--field); font-size: 13px; font-weight: 700; border-radius: var(--radius); }
.chip button { border: 0; background: none; padding: 0; display: grid; place-items: center; color: var(--muted); }
.chip button:hover { color: var(--ink); }

/* ===== COMPONENTE: CampoCardArena ===== */
.cards { display: grid; gap: 20px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .cards { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1280px) { .cards { grid-template-columns: repeat(3, 1fr); } }
.card { border: 1px solid var(--rule); background: var(--paper); display: flex; flex-direction: column; text-decoration: none; }
.card:hover { border-color: var(--rule-strong); }
.card-media { position: relative; aspect-ratio: 4 / 3; overflow: hidden; }
.card-disc { position: absolute; top: 10px; left: 10px; display: flex; gap: 4px; flex-wrap: wrap; }
.disc { font-family: var(--jost); font-weight: 700; font-size: 12px; padding: 3px 8px; background: rgba(17,17,17,.82); color: #fff; text-transform: capitalize; }
.card-feat { position: absolute; top: 10px; right: 10px; font-size: 12px; font-weight: 700; padding: 3px 8px; background: var(--red); color: #fff; }
.card-body { padding: 14px 14px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.card-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.card h3 { font-size: 18px; }
.rating { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.rating small { color: var(--muted); font-weight: 400; }
.loc { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; }
.meta-line { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; padding: 2px 8px; border: 1px solid var(--rule); color: var(--muted); }
.days { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.day {
  border: 1px solid var(--rule); padding: 4px 0; text-align: center; font-size: 11px; color: var(--muted); line-height: 1.2;
}
.day b { display: block; font-family: var(--jost); font-size: 15px; color: var(--ink); }
.day.on { border-color: var(--red); background: var(--red); color: #fff; }
.day.on b { color: #fff; }
.day.empty { border-style: dashed; }
.days-caption { font-size: 12px; color: var(--soft); margin-top: -4px; }
.card-foot { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 12px; border-top: 1px solid var(--rule); }
.from { font-size: 12px; color: var(--muted); }
.from .price { display: block; font-size: 22px; color: var(--ink); line-height: 1.1; }
.from .unit { font-size: 13px; color: var(--muted); }
.card .btn { min-height: 40px; padding: 0 14px; font-size: 13px; }

/* Fotos de ejemplo: arte por tipo de terreno (en producción, foto_portada_url) */
.ph { position: absolute; inset: 0; display: grid; place-items: end start; padding: 10px; }
.ph svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.ph-label { position: relative; font-size: 11px; color: rgba(255,255,255,.7); }
.t-bosque { background: linear-gradient(160deg, #2c3a26 0%, #1b2418 60%, #121a10 100%); }
.t-cqb { background: linear-gradient(160deg, #4a4d51 0%, #2c2e31 60%, #1c1d1f 100%); }
.t-urbano { background: linear-gradient(160deg, #3b414a 0%, #23272d 60%, #16181c 100%); }
.t-mixto { background: linear-gradient(160deg, #4b4433 0%, #2d281d 60%, #1c1912 100%); }
.t-desierto { background: linear-gradient(160deg, #7a5c40 0%, #4a3826 60%, #2c2117 100%); }

.empty-state { border: 1px dashed var(--rule-strong); padding: 40px 20px; text-align: center; }
.empty-state h3 { font-size: 20px; }
.empty-state p { color: var(--muted); margin: 8px auto 18px; max-width: 42ch; }

/* ===== COMPONENTE: ComoFunciona ===== */
.how { background: var(--field); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 40px 0; }
.how h2 { font-size: 24px; margin-bottom: 20px; }
.how-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; grid-template-columns: 1fr; counter-reset: s; }
@media (min-width: 768px) { .how-steps { grid-template-columns: repeat(3, 1fr); } }
.how-steps li { background: var(--paper); border: 1px solid var(--rule); padding: 18px; counter-increment: s; position: relative; }
.how-steps li::before { content: counter(s); font-family: var(--jost); font-weight: 900; font-size: 34px; color: var(--red); line-height: 1; display: block; margin-bottom: 10px; }
.how-steps h3 { font-family: var(--jost); font-weight: 700; font-size: 17px; margin: 0 0 6px; }
.how-steps p { margin: 0; color: var(--muted); font-size: 15px; }

.site-footer { padding: 28px 0 90px; color: var(--muted); font-size: 13px; }
.site-footer .wrap { display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; }
@media (min-width: 1000px) { .site-footer { padding-bottom: 28px; } }

/* ===== Detalle del campo ===== */
.crumbs { padding: 16px 0 12px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.crumbs a { text-decoration: none; color: var(--muted); }
.crumbs a:hover { color: var(--ink); text-decoration: underline; }

/* COMPONENTE: GaleriaCampo */
.gallery { display: grid; gap: 4px; grid-template-columns: 1fr; }
.gallery .g { position: relative; overflow: hidden; }
.gallery .g-main { aspect-ratio: 16 / 9; }
.gallery .g-small { display: none; }
@media (min-width: 768px) {
  .gallery { grid-template-columns: 2fr 1fr 1fr; grid-template-rows: 180px 180px; }
  .gallery .g-main { grid-row: 1 / 3; aspect-ratio: auto; }
  .gallery .g-small { display: block; }
}
.gallery-count { position: absolute; right: 10px; bottom: 10px; z-index: 2; font-size: 13px; font-weight: 700; background: var(--paper); color: var(--ink); border: 0; padding: 6px 10px; }

.detail-grid { display: grid; gap: 32px; grid-template-columns: 1fr; padding: 24px 0 64px; }
@media (min-width: 1000px) { .detail-grid { grid-template-columns: 1fr 380px; align-items: start; } }
.detail-head h1 { font-size: clamp(28px, 4.4vw, 40px); }
.detail-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-top: 10px; color: var(--muted); font-size: 15px; }
.detail-meta .rating { font-size: 15px; color: var(--ink); }
.detail-tags { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px; }
.detail-tags .tag { font-size: 13px; padding: 4px 10px; color: var(--ink); }
.detail-tags .tag.red { border-color: var(--red); color: var(--red); }
.lead { font-size: 17px; margin: 18px 0 0; max-width: 64ch; }
.dsection { border-top: 1px solid var(--rule); margin-top: 28px; padding-top: 24px; }
.dsection > h2 { font-size: 20px; margin-bottom: 14px; }

/* COMPONENTE: PaqueteCard */
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--rule); margin-bottom: 16px; }
.tab { border: 0; background: none; padding: 10px 14px; font-family: var(--jost); font-weight: 700; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; text-transform: capitalize; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--red); }
.pkgs { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .pkgs { grid-template-columns: repeat(2, 1fr); } }
.pkg { border: 1px solid var(--rule); padding: 16px; display: flex; flex-direction: column; gap: 8px; background: var(--paper); text-align: left; }
.pkg.selected { border-color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
.pkg-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.pkg h3 { font-family: var(--jost); font-weight: 800; font-size: 17px; margin: 0; text-transform: uppercase; }
.pkg .price { font-size: 20px; white-space: nowrap; }
.pkg .price small { font-family: var(--lato); font-weight: 400; font-size: 12px; color: var(--muted); }
.pkg-dur { font-size: 13px; color: var(--muted); }
.pkg ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 14px; }
.pkg li { display: flex; gap: 8px; align-items: flex-start; }
.pkg li svg { flex: 0 0 auto; margin-top: 3px; color: var(--red); }
.pkg .btn { align-self: flex-start; margin-top: 4px; min-height: 36px; font-size: 12px; }
.extras-list { display: grid; gap: 0; border: 1px solid var(--rule); }
.extra-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--rule); }
.extra-row:first-child { border-top: 0; }
.extra-row .x-name { font-weight: 700; }
.extra-row .x-sub { font-size: 13px; color: var(--muted); }
.extra-row .price { margin-left: auto; font-size: 16px; white-space: nowrap; }
.hours { width: 100%; border-collapse: collapse; font-size: 15px; max-width: 420px; }
.hours td { padding: 8px 0; border-bottom: 1px solid var(--rule); }
.hours td:last-child { text-align: right; font-weight: 700; }
.hours tr.closed td:last-child { color: var(--soft); font-weight: 400; }
.hours tr.today td { color: var(--red); }
.map-ph { position: relative; aspect-ratio: 16 / 7; background: #E9EAE5; border: 1px solid var(--rule); overflow: hidden; }
.map-ph svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.map-pin { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -100%); color: var(--red); }
.addr { margin-top: 10px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 15px; }
.policy { display: grid; gap: 10px; }
.policy-row { display: flex; gap: 12px; align-items: flex-start; }
.policy-row svg { flex: 0 0 auto; margin-top: 2px; }
.policy-row p { margin: 0; }
.policy-row small { display: block; color: var(--muted); font-size: 14px; }
.reviews { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .reviews { grid-template-columns: repeat(2, 1fr); } }
.review { border: 1px solid var(--rule); padding: 14px; }
.review-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.avatar { width: 32px; height: 32px; background: var(--ink); color: #fff; display: grid; place-items: center; font-family: var(--jost); font-weight: 800; }

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => '$' + Math.round(n).toLocaleString('es-MX');
const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromIso = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => { const t = new Date(); t.setHours(0, 0, 0, 0); return t; };
const fmtDow = (d) => d.toLocaleDateString('es-MX', { weekday: 'short' }).replace('.', '');
const fmtMon = (d) => d.toLocaleDateString('es-MX', { month: 'short' }).replace('.', '');
const fmtLong = (d) => d.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });

const fmtHour = (h) => { const [hh, mm] = h.split(':').map(Number); const ap = hh >= 12 ? 'pm' : 'am'; const h12 = ((hh + 11) % 12) + 1; return mm ? `${h12}:${pad(mm)} ${ap}` : `${h12} ${ap}`; };
const unitLabel = (u) => ({ por_persona: 'por persona', por_reserva: 'por grupo', por_unidad: 'c/u' }[u]);

// Días cerrados de ejemplo: índice de "próximo día abierto" que se marca cerrado (evento privado)
FIELDS.forEach(f => {
  const idx = f.cerrados; f.cerrados = [];
  if (idx.length) { const all = openDaysRaw(f, 30); idx.forEach(i => all[i] && f.cerrados.push(iso(all[i]))); }
});

function openDaysRaw(f, horizon) {
  const out = []; const t = today();
  for (let i = 0; i <= horizon; i++) { const d = addDays(t, i); if (f.horario[DAY_KEYS[d.getDay()]]) out.push(d); }
  return out;
}
// Misma regla que arena_open_days: abre según horario, no está cerrado y respeta anticipación mínima
function isOpen(f, d) {
  const h = f.horario[DAY_KEYS[d.getDay()]];
  if (!h || f.cerrados.includes(iso(d))) return false;
  const [hh, mm] = h[0].split(':').map(Number);
  const apertura = new Date(d); apertura.setHours(hh, mm, 0, 0);
  if (apertura.getTime() < Date.now() + ANTICIPACION_MIN_H * 3600e3) return false;
  return addDays(today(), 60) >= d;
}
function nextOpenDays(f, n = 6, horizon = 21) {
  const out = [];
  for (let i = 0; i <= horizon && out.length < n; i++) { const d = addDays(today(), i); if (isOpen(f, d)) out.push(d); }
  return out;
}
function baseItems(f, { jugadores, disciplinas } = {}) {
  return f.items.filter(i => (i.tipo === 'paquete' || i.tipo === 'derecho_campo')
    && (!jugadores || ((!i.minJ || jugadores >= i.minJ) && (!i.maxJ || jugadores <= i.maxJ)))
    && (!disciplinas || !disciplinas.length || !i.disciplina || disciplinas.includes(i.disciplina)));
}
// Misma regla que arena_marketplace: prefiere el precio por persona más bajo
function desde(f, opts) {
  const b = baseItems(f, opts).sort((a, z) => (a.unidad === 'por_persona' ? 0 : 1) - (z.unidad === 'por_persona' ? 0 : 1) || a.precio - z.precio);
  return b[0] || null;
}

// Curvas de nivel para el hero y las fotos de ejemplo (en producción: foto real del campo)
function topo(seed = 1, stroke = '#ffffff', w = 400, h = 300, lines = 9) {
  let s = seed * 9301 + 49297; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  let paths = '';
  const cx = w * (0.3 + rnd() * 0.4), cy = h * (0.35 + rnd() * 0.3);
  for (let k = 1; k <= lines; k++) {
    const r = k * (Math.max(w, h) / (lines * 1.3)); let d = '';
    for (let a = 0; a <= 24; a++) {
      const t = (a / 24) * Math.PI * 2; const wob = 1 + 0.16 * Math.sin(t * 3 + k + seed) + 0.08 * Math.cos(t * 5 - k);
      const x = cx + Math.cos(t) * r * wob * 1.25, y = cy + Math.sin(t) * r * wob * 0.85;
      d += (a ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    }
    paths += `<path d="${d}Z" fill="none" stroke="${stroke}" stroke-opacity="${(0.55 - k * 0.035).toFixed(2)}" stroke-width="1"/>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${paths}</svg>`;
}
function photo(f, label = 'Foto del campo', idx = 0) {
  const t = f.terrenos[0] || 'mixto'; const seed = [...f.slug].reduce((a, c) => a + c.charCodeAt(0), 0) + idx * 7;
  return `<div class="ph t-${t}">${topo(seed, '#ffffff', 400, 300, 8)}<span class="ph-label">${esc(label)}</span></div>`;
}

/* Cálculo de una reserva (mismo criterio que arena_create_booking; el servidor recalcula siempre) */
function priceLines(f, sel) {
  const lines = []; const j = sel.jugadores;
  const base = f.items.find(i => i.id === sel.paqueteId);
  if (base) { const q = base.unidad === 'por_persona' ? j : 1; lines.push({ id: base.id, nombre: base.nombre, cantidad: q, precio: base.precio, subtotal: base.precio * q, unidad: base.unidad }); }
  f.items.filter(i => i.tipo === 'renta' || i.tipo === 'extra').forEach(i => {
    const q = sel.extras[i.id] || 0; if (!q) return;
    lines.push({ id: i.id, nombre: i.nombre, cantidad: q, precio: i.precio, subtotal: i.precio * q, unidad: i.unidad });
  });
  return { lines, total: lines.reduce((a, l) => a + l.subtotal, 0) };
}

function filteredFields() {
  const F = state.filters;
  let list = FIELDS.filter(f => {
    if (F.estado && f.estado !== F.estado) return false;
    if (F.disciplinas.length && !F.disciplinas.some(d => f.disciplinas.includes(d))) return false;
    if (F.terrenos.length && !F.terrenos.some(t => f.terrenos.includes(t))) return false;
    if (F.conRenta && !f.items.some(i => i.tipo === 'renta')) return false;
    if (F.rating45 && f.rating < 4.5) return false;
    const d = desde(f, { jugadores: F.jugadores, disciplinas: F.disciplinas });
    if (!d) return false;
    if (F.precioMax < 500 && d.unidad === 'por_persona' && d.precio > F.precioMax) return false;
    if (F.fecha && !isOpen(f, fromIso(F.fecha))) return false;
    return true;
  });
  const price = f => { const d = desde(f, { jugadores: F.jugadores, disciplinas: F.disciplinas }); return d.unidad === 'por_persona' ? d.precio : d.precio / Math.max(F.jugadores || 10, 1); };
  if (F.orden === 'precio_asc') list.sort((a, b) => price(a) - price(b));
  else if (F.orden === 'precio_desc') list.sort((a, b) => price(b) - price(a));
  else if (F.orden === 'rating') list.sort((a, b) => b.rating - a.rating);
  else list.sort((a, b) => (b.destacado - a.destacado) || (b.rating - a.rating));
  return list;
}

function renderResults() {
  const F = state.filters; const list = filteredFields();
  const title = $('#results-title');
  if (!title) return;
  const where = F.estado ? `en ${F.estado}` : 'en México';
  const when = F.fecha ? ` · abren el ${fmtLong(fromIso(F.fecha))}` : '';
  title.innerHTML = `${list.length} ${list.length === 1 ? 'campo' : 'campos'} ${esc(where)}<small>Con reserva y pago en línea${esc(when)}</small>`;

  const chips = [];
  if (F.fecha) chips.push(['fecha', '', cap(fmtLong(fromIso(F.fecha)))]);
  if (F.estado) chips.push(['estado', '', F.estado]);
  if (F.jugadores) chips.push(['jugadores', '', `${F.jugadores} jugadores`]);
  F.disciplinas.forEach(d => chips.push(['disciplinas', d, d[0].toUpperCase() + d.slice(1)]));
  F.terrenos.forEach(t => chips.push(['terrenos', t, TERR_LABEL[t]]));
  if (F.precioMax < 500) chips.push(['precioMax', '', `Hasta ${money(F.precioMax)}`]);
  if (F.conRenta) chips.push(['conRenta', '', 'Rentan equipo']);
  if (F.rating45) chips.push(['rating45', '', '4.5 o más']);
  $('#chips').innerHTML = chips.map(([k, v, l]) => `<span class="chip">${esc(l)}<button type="button" data-action="remove-chip" data-key="${k}" data-value="${esc(v)}" aria-label="Quitar filtro ${esc(l)}">${I.x}</button></span>`).join('');

  const n = chips.filter(c => !['fecha', 'estado', 'jugadores'].includes(c[0])).length;
  const ob = $('#filters-open-btn span'); if (ob) ob.textContent = n ? `Filtros (${n})` : 'Filtros';
  const ab = $('#filters-apply-btn'); if (ab) ab.textContent = `Ver ${list.length} ${list.length === 1 ? 'campo' : 'campos'}`;

  $('#cards').innerHTML = list.length ? list.map(renderCard).join('') : `
    <div class="empty-state" style="grid-column:1/-1">
      <h3 class="h-brand">Ningún campo coincide</h3>

    </div>`;
}

function initDetail(slug, query) {
  const f = bySlug(slug); if (!f) return null;
  const editing = state.editIndex != null ? state.cart[state.editIndex] : null;
  const open = nextOpenDays(f, 1, 60);
  const qFecha = query.get('fecha');
  const fecha = editing ? editing.fecha : (qFecha && isOpen(f, fromIso(qFecha)) ? qFecha : '');
  const disc = state.filters.disciplinas.find(x => f.disciplinas.includes(x)) || f.disciplinas[0];
  const ref = fecha ? fromIso(fecha) : (open[0] || today());
  return {
    slug, fecha, disciplina: editing ? (f.items.find(i => i.id === editing.paqueteId)?.disciplina || disc) : disc,
    jugadores: editing ? editing.jugadores : (state.filters.jugadores || 4),
    paqueteId: editing ? editing.paqueteId : null,
    extras: editing ? { ...editing.extras } : {},
    mes: new Date(ref.getFullYear(), ref.getMonth(), 1),

  };
}

function renderCalendar(f) {
  const s = state.detail; const m = s.mes; const first = new Date(m.getFullYear(), m.getMonth(), 1);
  const startOffset = (first.getDay() + 6) % 7; // lunes primero
  const daysIn = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
  const t = today(); const canPrev = first > new Date(t.getFullYear(), t.getMonth(), 1);
  const canNext = first < new Date(t.getFullYear(), t.getMonth() + 2, 1);
  let cells = ['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(x => `<span class="dow" aria-hidden="true">${x}</span>`).join('');
  for (let i = 0; i < startOffset; i++) cells += '<span></span>';
  for (let day = 1; day <= daysIn; day++) {
    const d = new Date(m.getFullYear(), m.getMonth(), day); const v = iso(d);
    const open = isOpen(f, d); const blocked = f.cerrados.includes(v);
    const label = `${fmtLong(d)}${open ? '' : blocked ? ', cerrado por evento privado' : ', sin reserva'}`;
    cells += `<button type="button" class="${open ? 'open' : ''}${blocked ? ' blocked' : ''}" ${open ? `data-action="pick-date" data-date="${v}"` : 'disabled'} aria-pressed="${s.fecha === v}" aria-label="${label}">${day}</button>`;
  }
  const hasBlocked = f.cerrados.some(c => fromIso(c).getMonth() === m.getMonth());
  return `
  <div class="cal-head">
    <button class="icon-btn" type="button" data-action="month" data-d="-1" aria-label="Mes anterior" ${canPrev ? '' : 'disabled'}>${I.prev}</button>
    <b>${cap(m.toLocaleDateString('es-MX', { month: 'long', year: 'numeric' }))}</b>
    <button class="icon-btn" type="button" data-action="month" data-d="1" aria-label="Mes siguiente" ${canNext ? '' : 'disabled'}>${I.next}</button>
  </div>
  <div class="cal">${cells}</div>
  <div class="cal-legend">Solo se pueden elegir los días en que abre el campo.${hasBlocked ? ' Los tachados están cerrados por evento privado.' : ''}</div>`;
}

    return `

      <div class="citem-head">
        <div class="citem-thumb">${photo(f, '')}</div>
        <div>
          <h3>${esc(f.nombre)}</h3>
          <div class="citem-date">${cap(fmtLong(fromIso(c.fecha)))} <small>· abre ${fmtHour(h[0])}</small></div>
          <div style="font-size:13px;color:#666">${c.jugadores} ${c.jugadores === 1 ? 'jugador' : 'jugadores'} · ${esc(f.ciudad)}</div>
        </div>
      </div>
      <div class="citem-lines">${c.lines.map(l => `<div><span>${esc(l.nombre)} × ${l.cantidad}</span><span>${money(l.subtotal)}</span></div>`).join('')}</div>
      <div class="citem-foot">
        <span class="price">${money(c.total)}</span>
        <span>
          <button class="btn btn-ghost" type="button" data-action="edit-item" data-i="${i}">Editar</button>
          <button class="btn btn-ghost" type="button" data-action="remove-item" data-i="${i}">Quitar</button>
        </span>
      </div>
    </article>`;
  }).join('');
  const total = state.cart.reduce((a, c) => a + c.total, 0);
  foot.innerHTML = `
    <div class="sum-total" style="margin:0;padding:0;border:0"><b>Total (${state.cart.length} ${state.cart.length === 1 ? 'reserva' : 'reservas'})</b><span class="price">${money(total)}</span></div>
    <a class="btn btn-primary btn-block" href="#/checkout" data-action="close-overlays">Continuar al pago</a>
    <p class="fine" style="justify-content:center">Un solo pago para todas tus reservas.</p>`;
}
function openOverlay(id) { $('#' + id).classList.add('open'); $('#scrim').classList.add('show'); document.body.style.overflow = 'hidden'; if (id === 'drawer') { renderCart(); $('#drawer .icon-btn').focus(); } }
function closeOverlays() { document.querySelectorAll('.drawer.open, .filters.open').forEach(e => e.classList.remove('open')); $('#scrim').classList.remove('show'); document.body.style.overflow = ''; }

function upsertCart(item) {
  const i = state.cart.findIndex(c => c.slug === item.slug && c.fecha === item.fecha);
  if (i >= 0) { state.cart[i] = item; saveCart(); return 'replaced'; }
  if (state.cart.length >= MAX_CART) return 'full';
  state.cart.push(item); saveCart(); return 'added';
}

/* =====================================================================
   VISTA: CHECKOUT (/arena/checkout)
   ===================================================================== */
function renderCheckout() {
  if (!state.cart.length) return `<div class="wrap"><div class="page-title"><h1 class="h-brand">No hay nada que pagar</h1><p>Tu carrito está vacío.</p></div><a class="btn btn-line" href="#/">Ver campos</a></div>`;
  const total = state.cart.reduce((a, c) => a + c.total, 0);
  const minPol = Math.min(...state.cart.map(c => bySlug(c.slug).politicaHoras));
  return `
  <div class="wrap">
    <div class="page-title"><h1 class="h-brand">Datos y pago</h1><p>${state.cart.length} ${state.cart.length === 1 ? 'reserva' : 'reservas'} en un solo pago.</p></div>
    <div class="checkout-grid">
      <form data-form="checkout" novalidate>
        <section class="panel">
          <h2 class="h-brand">Tus datos</h2>
          <p class="sub">Aquí te mandamos los QR de entrada y el recibo.</p>
          <div class="login-hint"><span>¿Tienes cuenta de AirNation? Tus reservas quedan en tu perfil.</span><a href="#">Iniciar sesión</a></div>
          <div class="form-grid">
            <div class="field full"><label for="c-nombre">Nombre de quien reserva</label><input id="c-nombre" name="nombre" autocomplete="name" required></div>
            <div class="field"><label for="c-email">Correo</label><input id="c-email" name="email" type="email" autocomplete="email" required></div>
            <div class="field"><label for="c-tel">Celular</label><input id="c-tel" name="telefono" type="tel" autocomplete="tel" inputmode="tel" placeholder="10 dígitos"></div>
          </div>
        </section>
        <section class="panel">
          <h2 class="h-brand">Pago</h2>
          <p class="sub">Tienes 15 minutos para completar el pago una vez que continúes.</p>
          <div class="pay-box">${I.lock}<p><b>Pago seguro</b>Te llevamos a la página del procesador para pagar con tarjeta de crédito o débito. AirNation no guarda los datos de tu tarjeta.</p></div>
          <label class="consent" style="margin-top:14px"><input type="checkbox" name="acepto" required><span>Acepto la política de cancelación de cada campo (reembolso del 100% si cancelo con al menos ${minPol} h de anticipación a la apertura), los <a href="#">Términos</a> y el <a href="#">Aviso de Privacidad</a>.</span></label>
          <p class="form-error" id="co-error" role="alert" style="margin-top:12px"></p>
          <button class="btn btn-primary btn-block" type="submit" style="margin-top:12px">Pagar ${money(total)}</button>
        </section>
      </form>
      <aside class="panel order-sum" aria-labelledby="osum-title">
        <h2 class="h-brand" id="osum-title" style="margin-bottom:14px">Resumen</h2>
        ${state.cart.map((c, i) => { const f = bySlug(c.slug); return `<div class="osum-item"><div class="osum-title"><span>${esc(f.nombre)}</span><span>${money(c.total)}</span></div><div class="osum-sub">${cap(fmtLong(fromIso(c.fecha)))} · ${c.jugadores} jugadores</div><div style="font-size:13px;color:#666">${c.lines.map(l => `${esc(l.nombre)} × ${l.cantidad}`).join(', ')}</div><button class="btn btn-ghost" style="padding:0;min-height:28px;font-size:13px" type="button" data-action="edit-item" data-i="${i}">Editar</button></div>`; }).join('')}
        <div class="sum-total"><b>Total</b><span class="price">${money(total)}</span></div>
        <p class="fine" style="margin-top:8px">El precio incluye todos los cargos. Sin comisiones extra.</p>
      </aside>
    </div>
  </div>`;
}

/* =====================================================================
   VISTA: CONFIRMACIÓN (/arena/confirmacion) — un QR por reserva
   ===================================================================== */
function fakeQR(text, size = 25) {
  let h = 2166136261; for (const ch of text) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  const rnd = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 1000) / 1000; };
  const finder = (x, y) => { for (const [fx, fy] of [[0, 0], [size - 7, 0], [0, size - 7]]) { const dx = x - fx, dy = y - fy; if (dx >= 0 && dx < 7 && dy >= 0 && dy < 7) return (dx === 0 || dx === 6 || dy === 0 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4)) ? 1 : 0; } return -1; };
  let r = '';
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const fv = finder(x, y); const on = fv === -1 ? rnd() > 0.52 : fv === 1;
    if (on) r += `<rect x="${x + 2}" y="${y + 2}" width="1" height="1"/>`;
  }
  return `<svg viewBox="0 0 ${size + 4} ${size + 4}" shape-rendering="crispEdges" role="img" aria-label="Código QR de la reserva ${esc(text)}"><rect width="100%" height="100%" fill="#fff"/><g fill="#111">${r}</g></svg>`;
}
function code() { const a = '23456789ABCDEFGHJKMNPQRSTUVWXYZ'; let s = 'AR-'; for (let i = 0; i < 6; i++) s += a[Math.floor(Math.random() * a.length)]; return s; }

function renderConfirm() {
  const o = state.lastOrder;
  if (!o) return `<div class="wrap"><div class="page-title"><h1 class="h-brand">No hay reservas recientes</h1></div><a class="btn btn-line" href="#/">Ver campos</a></div>`;
  return `
  <div class="wrap">
    <div class="confirm-head">
      <span class="confirm-check"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="2.8"/></svg></span>
      <div><h1 class="h-brand">Tus reservas están confirmadas</h1><p>Enviamos ${o.items.length === 1 ? 'el QR' : `los ${o.items.length} QR`} y el recibo a <b style="color:#111">${esc(o.email)}</b>. Pagaste ${money(o.total)}.</p></div>
    </div>
    <div class="tickets">
      ${o.items.map(c => { const f = bySlug(c.slug); const h = f.horario[DAY_KEYS[fromIso(c.fecha).getDay()]]; return `
      <!-- COMPONENTE: TicketQR -->
      <article class="ticket">
        <div class="ticket-qr">${fakeQR(c.codigo)}<span class="ticket-code">${c.codigo}</span></div>
        <div class="ticket-info">
          <h3>${esc(f.nombre)}</h3>
          <div class="when">${cap(fmtLong(fromIso(c.fecha)))}</div>
          <div class="lines">Abre ${fmtHour(h[0])} · ${c.jugadores} jugadores</div>
          <div class="lines">${c.lines.map(l => `${esc(l.nombre)} × ${l.cantidad}`).join(', ')}</div>
          <div class="lines">${esc(f.direccion)}</div>
          <div class="ticket-actions">
            <button class="btn btn-dark" type="button">Descargar QR</button>
            <a class="btn btn-line" href="#">Cómo llegar</a>
            <button class="btn btn-ghost" type="button">Cancelar reserva</button>
          </div>
        </div>
      </article>`; }).join('')}
    </div>
    <p class="confirm-note">Una persona del grupo muestra el QR en la entrada, desde el celular o impreso. El campo lo escanea una sola vez y registra cuántos llegaron. Puedes cancelar con reembolso completo hasta el plazo de cada campo.</p>
    <a class="btn btn-line" href="#/" style="margin-bottom:48px">Seguir explorando campos</a>
  </div>`;
}

/* =====================================================================
   ROUTER
   ===================================================================== */
function route() {
  const raw = location.hash.replace(/^#/, '') || '/';
  const [path, qs] = raw.split('?'); const query = new URLSearchParams(qs || '');
  const app = $('#app'); closeOverlays(); $('#toast').classList.remove('show');
  const nav = document.querySelector('.main-nav a[aria-current]');
  if (path.startsWith('/campo/')) {
    const slug = path.split('/')[2];
    state.detail = initDetail(slug, query);
    if (!state.detail) { location.hash = '#/'; return; }
    app.innerHTML = renderDetail(); document.title = `Reservar en ${bySlug(slug).nombre} — ARENA`;
  } else if (path === '/checkout') {
    state.editIndex = null; app.innerHTML = renderCheckout(); document.title = 'Datos y pago — ARENA';
  } else if (path === '/confirmacion') {
    app.innerHTML = renderConfirm(); document.title = 'Reservas confirmadas — ARENA';
  } else {
    state.editIndex = null; app.innerHTML = renderLanding(); renderResults(); document.title = 'ARENA · Reserva tu campo — AirNation';
  }
  window.scrollTo(0, 0);
}
function rerenderDetail() {
  const y = window.scrollY; $('#app').innerHTML = renderDetail(); window.scrollTo(0, y);
}

/* =====================================================================
   EVENTOS (delegados)
   ===================================================================== */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action; const F = state.filters; const s = state.detail;
  switch (a) {
    case 'open-cart': openOverlay('drawer'); break;
    case 'open-filters': openOverlay('filters'); break;
    case 'close-overlays': closeOverlays(); break;
    case 'set-date':
      F.fecha = el.dataset.date;
      document.querySelectorAll('.date-tile').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.date === F.fecha)));
      renderResults(); break;
    case 'remove-chip': {
      const k = el.dataset.key, v = el.dataset.value;
      if (k === 'disciplinas' || k === 'terrenos') F[k] = F[k].filter(x => x !== v);
      else if (k === 'precioMax') F.precioMax = 500; else if (k === 'jugadores') F.jugadores = 0; else F[k] = (k === 'conRenta' || k === 'rating45') ? false : '';
      route(); document.getElementById('resultados').scrollIntoView(); break;
    }
    case 'clear-filters':
      Object.assign(F, { estado: '', fecha: '', jugadores: 0, disciplinas: [], terrenos: [], precioMax: 500, conRenta: false, rating45: false });
      route(); document.getElementById('resultados').scrollIntoView(); break;
    case 'go-estado': e.preventDefault(); F.estado = el.dataset.estado; location.hash = '#/'; break;
    case 'set-disc': s.disciplina = el.dataset.disc; s.paqueteId = null; rerenderDetail(); break;
    case 'pick-pkg': s.paqueteId = el.dataset.id; s.error = ''; rerenderDetail(); break;
    case 'pick-date': s.fecha = el.dataset.date; s.error = ''; rerenderDetail(); break;
    case 'month': s.mes = new Date(s.mes.getFullYear(), s.mes.getMonth() + Number(el.dataset.d), 1); rerenderDetail(); break;
    case 'players': {
      const f = bySlug(s.slug); s.jugadores = Math.min(60, Math.max(1, s.jugadores + Number(el.dataset.d)));
      const p = f.items.find(i => i.id === s.paqueteId);
      if (p && ((p.minJ && s.jugadores < p.minJ) || (p.maxJ && s.jugadores > p.maxJ))) s.paqueteId = null;
      f.items.forEach(i => { if (i.unidad === 'por_persona' && s.extras[i.id] > s.jugadores) s.extras[i.id] = s.jugadores; });
      rerenderDetail(); break;
    }
    case 'extra': {
      const id = el.dataset.id; const q = (s.extras[id] || 0) + Number(el.dataset.d);
      s.extras[id] = Math.max(0, Math.min(Number(el.dataset.max || 99), q)); rerenderDetail(); break;
    }
    case 'scroll-book': $('#book').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); break;
    case 'add-cart':
    case 'book-now': {
      s.error = validateDetail(); if (s.error) { rerenderDetail(); $('.form-error')?.scrollIntoView({ block: 'center' }); break; }
      const r = upsertCart(detailToCartItem());
      if (r === 'full') { s.error = `Tu carrito ya tiene ${MAX_CART} reservas. Paga o quita alguna para agregar otra.`; rerenderDetail(); break; }
      updateCartCount(true);
      if (a === 'book-now') { location.hash = '#/checkout'; break; }
      state.cartNote = r === 'replaced' ? `Actualizamos tu reserva en ${bySlug(s.slug).nombre} para ese día.` : `Agregamos ${bySlug(s.slug).nombre} a tu carrito.`;
      openOverlay('drawer'); break;
    }
    case 'save-edit': {
      s.error = validateDetail(); if (s.error) { rerenderDetail(); break; }
      const item = detailToCartItem(); const dup = state.cart.findIndex((c, i) => i !== state.editIndex && c.slug === item.slug && c.fecha === item.fecha);
      if (dup >= 0) state.cart.splice(dup, 1);
      state.cart[state.editIndex > dup && dup >= 0 ? state.editIndex - 1 : state.editIndex] = item;
      state.editIndex = null; saveCart(); toast('Cambios guardados.'); location.hash = '#/checkout'; break;
    }
    case 'cancel-edit': state.editIndex = null; history.back(); break;
    case 'edit-item': {
      const i = Number(el.dataset.i); state.editIndex = i; state.detail = null; closeOverlays();
      const target = `#/campo/${state.cart[i].slug}`;
      if (location.hash === target) route(); else location.hash = target; break;
    }
    case 'remove-item': state.cart.splice(Number(el.dataset.i), 1); saveCart(); renderCart(); if (location.hash === '#/checkout') route(); break;
  }
});

document.addEventListener('change', (e) => {
  const el = e.target; const k = el.dataset.filter; if (!k) return; const F = state.filters;
  if (k === 'estado') F.estado = el.value;
  else if (k === 'jugadores') F.jugadores = Number(el.value);
  else if (k === 'disciplina-single') F.disciplinas = el.value ? [el.value] : [];
  else if (k === 'orden') F.orden = el.value;
  else if (k === 'disciplinas' || k === 'terrenos') F[k] = el.checked ? [...new Set([...F[k], el.value])] : F[k].filter(x => x !== el.value);
  else if (k === 'conRenta' || k === 'rating45') F[k] = el.checked;
  if (k === 'disciplinas') { const sd = $('#s-disc'); if (sd) sd.value = F.disciplinas.length === 1 ? F.disciplinas[0] : ''; }
  if (k === 'disciplina-single') document.querySelectorAll('[data-filter="disciplinas"]').forEach(c => c.checked = F.disciplinas.includes(c.value));
  renderResults();
});
document.addEventListener('input', (e) => {
  if (e.target.dataset.filter !== 'precioMax') return;
  state.filters.precioMax = Number(e.target.value);
  $('#f-precio-val').textContent = state.filters.precioMax >= 500 ? 'Sin límite' : 'Hasta ' + money(state.filters.precioMax);
  renderResults();
});
document.addEventListener('submit', (e) => {
  const form = e.target; e.preventDefault();
  if (form.dataset.form === 'search') { document.getElementById('resultados').scrollIntoView({ behavior: 'smooth' }); return; }
  if (form.dataset.form === 'checkout') {
    const err = $('#co-error'); err.textContent = '';
    const nombre = form.nombre.value.trim(), email = form.email.value.trim();
    form.querySelectorAll('input').forEach(i => i.removeAttribute('aria-invalid'));
    if (!nombre) { form.nombre.setAttribute('aria-invalid', 'true'); err.textContent = 'Escribe el nombre de quien reserva.'; form.nombre.focus(); return; }
    if (!/^\S+@\S+\.\S+$/.test(email)) { form.email.setAttribute('aria-invalid', 'true'); err.textContent = 'Revisa el correo: ahí te llegan los QR.'; form.email.focus(); return; }
    if (!form.acepto.checked) { err.textContent = 'Para pagar necesitas aceptar la política de cancelación y los términos.'; return; }
    // Producción: POST /api/v1/arena/checkout → redirige al checkout del proveedor → webhook confirma → /arena/confirmacion
    $('#processing').classList.add('show');
    setTimeout(() => {
      state.lastOrder = { email, total: state.cart.reduce((a, c) => a + c.total, 0), items: state.cart.map(c => ({ ...c, codigo: code() })) };
      state.cart = []; saveCart(); $('#processing').classList.remove('show'); location.hash = '#/confirmacion';
    }, 1300);
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeOverlays(); });
window.addEventListener('hashchange', route);

updateCartCount();
route();
</script>
